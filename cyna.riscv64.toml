name = "cory-riscv64"
src = "src"
entry = "src/kernel/platform/qemu_riscv64_virt/main.cy"

[build]
target = "riscv64-none-elf"
cpu = "generic-rv64"
opt = "release"
emit = ["elf", "bin"]

[link]
script = "src/kernel/platform/qemu_riscv64_virt/link.ld"
entry_symbol = "_start"

[asm]
sources = ["src/kernel/arch/riscv64/start.S", "src/kernel/arch/riscv64/trap.S", "src/kernel/platform/qemu_riscv64_virt/normal_thread.S"]
