name = "cory-timerirqtest"
src = "src"
entry = "src/kernel/platform/qemu_aarch64_virt/timerirqtest.cy"

[build]
target = "aarch64-none-elf"
cpu = "generic"
opt = "release"
emit = ["elf", "bin"]

[link]
script = "src/kernel/platform/qemu_aarch64_virt/link.ld"
entry_symbol = "_start"

[asm]
sources = ["src/kernel/arch/aarch64/start.S", "src/kernel/arch/aarch64/exception.S"]
