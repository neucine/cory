name = "cory"
src = "src"
entry = "src/platform/qemu_aarch64_virt/main.cy"

[build]
target = "aarch64-none-elf"
cpu = "generic"
opt = "release"
emit = ["elf", "bin"]

[link]
script = "src/platform/qemu_aarch64_virt/link.ld"
entry_symbol = "_start"

[asm]
sources = ["src/arch/aarch64/start.S", "src/arch/aarch64/exception.S", "src/platform/qemu_aarch64_virt/normal_thread.S", "src/platform/qemu_aarch64_virt/user_programs.S"]
